name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHP syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.0", "8.2", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mysqli, gd
          coverage: none

      - name: Lint every file the project owns
        run: |
          set -euo pipefail
          # dist/ and plugins/ are vendored AdminLTE, not ours to lint.
          mapfile -t files < <(find . -name '*.php' -not -path './dist/*' -not -path './plugins/*' | sort)
          echo "Linting ${#files[@]} files"
          for file in "${files[@]}"; do
            php -l "$file" > /dev/null || { echo "Syntax error in $file"; php -l "$file"; exit 1; }
          done
          echo "All ${#files[@]} files parse cleanly."

  smoke:
    name: Boot and sign in
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Bring up the stack
        run: |
          cp .env.example .env
          docker compose up -d --build
          echo "Waiting for the app to answer..."
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/ > /dev/null 2>&1; then
              echo "Up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "The app never came up."; docker compose logs; exit 1

      - name: The home page renders
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8000/ | grep -qi "<html" || { echo "No HTML returned"; exit 1; }
          echo "Home page renders."

      - name: The admin sign-in works with the seeded account
        run: |
          set -euo pipefail
          response=$(curl -fsS -X POST "http://localhost:8000/classes/Login.php?f=login" \
            -d "username=admin" -d "password=admin123")
          echo "Response: $response"
          echo "$response" | grep -q '"status":"success"' \
            || { echo "Sign-in failed - bcrypt verification or the demo seed is wrong"; exit 1; }
          echo "Admin sign-in succeeded."

      - name: A wrong password is rejected, and leaks nothing
        run: |
          set -euo pipefail
          response=$(curl -fsS -X POST "http://localhost:8000/classes/Login.php?f=login" \
            -d "username=admin" -d "password=definitely-not-the-password")
          echo "Response: $response"
          echo "$response" | grep -q '"status":"incorrect"' || { echo "Wrong password was not rejected"; exit 1; }
          # The old code returned the SQL statement and the mysqli error here.
          echo "$response" | grep -qi "select\|last_qry\|mysql" && { echo "The failure response leaks internals"; exit 1; }
          echo "Wrong password rejected cleanly."

      - name: A legacy MD5 account still signs in and is upgraded to bcrypt
        run: |
          set -euo pipefail
          # 5f4dcc3b... is md5('password') - the format every account used before.
          docker compose exec -T db mysql -ucbs -pcbs_local_password cbsphp \
            -e "UPDATE users SET password='5f4dcc3b5aa765d61d8327deb882cf99' WHERE username='admin';"

          curl -fsS -X POST "http://localhost:8000/classes/Login.php?f=login" \
            -d "username=admin" -d "password=password" | grep -q '"status":"success"' \
            || { echo "A legacy MD5 account could not sign in"; exit 1; }

          stored=$(docker compose exec -T db mysql -N -B -ucbs -pcbs_local_password cbsphp \
            -e "SELECT password FROM users WHERE username='admin';")
          echo "Stored hash now: ${stored:0:7}..."
          case "$stored" in
            \$2y\$*|\$2a\$*|\$2b\$*) echo "Upgraded to bcrypt on sign-in." ;;
            *) echo "Hash was not upgraded: $stored"; exit 1 ;;
          esac

      - name: Secrets and dumps are not served
        run: |
          set -euo pipefail
          for path in .env database/01-schema.sql docker-compose.yml; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8000/$path")
            echo "  /$path -> $code"
            case "$code" in
              403|404) ;;
              *) echo "$path is reachable over HTTP"; exit 1 ;;
            esac
          done
          echo "Secrets and dumps are not reachable."

      - name: Path traversal in the page router is refused
        run: |
          set -euo pipefail
          body=$(curl -fsS "http://localhost:8000/admin/index.php?page=../../config")
          echo "$body" | grep -qi "DB_PASSWORD\|mysqli" && { echo "Traversal reached a file it should not"; exit 1; }
          echo "Traversal refused."

      - name: Tear down
        if: always()
        run: docker compose down -v
